<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | ODIN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Left side: background image, logo and photo credit -->
  <aside class="side">
    <div class="logo">
      <!-- simple helmet drawn as an inline SVG -->
      <svg class="logo-icon" viewBox="0 0 60 70" aria-hidden="true">
        <path d="M16 28 L8 6 L12 4 L22 24 L38 24 L48 4 L52 6 L44 28 L44 46 L36 62 L30 66 L24 62 L16 46 Z"/>
        <path d="M22 38 L27 40 M38 38 L33 40 M24 50 L30 57 L36 50"/>
      </svg>
      <span class="logo-text">ODIN</span>
    </div>

    <p class="credit">
      Photo by <a href="https://unsplash.com/@insolitus">Rowan Heuvel</a> on
      <a href="https://unsplash.com/">Unsplash</a>
    </p>
  </aside>

  <!-- Right side: intro text and the form -->
  <main class="content">
    <form id="signup-form" action="#" method="post">
      <section class="intro">
        <p>
          This is not a real online service! You know you need something like this
          in your life to help you realize your deepest dreams. Sign up <em>now</em>
          to get started.
        </p>
        <p>You <em>know</em> you want to.</p>
      </section>

      <section class="form-box">
        <h2>Let's do this!</h2>

        <div class="fields">
          <div class="field">
            <label for="first-name">First name</label>
            <input type="text" id="first-name" name="first-name" minlength="2" required>
          </div>

          <div class="field">
            <label for="last-name">Last name</label>
            <input type="text" id="last-name" name="last-name" minlength="2" required>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="field">
            <label for="phone">Phone number</label>
            <!-- optional, but if filled in it must look like +37120000000 -->
            <input type="tel" id="phone" name="phone" pattern="\+?[0-9 ]{7,15}"
                   title="Digits only, 7 to 15 characters. A leading + is allowed.">
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8" required>
          </div>

          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" name="confirm-password" minlength="8" required>
          </div>
        </div>
      </section>

      <section class="actions">
        <button type="submit">Create Account</button>
        <p>Already have an account? <a href="#">Log in</a></p>
      </section>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
